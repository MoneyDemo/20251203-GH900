name: Unit Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore TodoDemo.Tests/TodoDemo.Tests.csproj
      
    - name: Build
      run: dotnet build TodoDemo.Tests/TodoDemo.Tests.csproj --no-restore --configuration Release
      
    - name: Run tests
      run: dotnet test TodoDemo.Tests/TodoDemo.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TodoDemo.Tests/TestResults/test-results.trx
